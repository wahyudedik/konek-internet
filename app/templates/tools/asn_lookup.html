{% extends "base.html" %}
{% block title %}ASN Lookup - Autonomous System Number{% endblock %}
{% block content %}
<a href="/" class="back-link">← Kembali ke Beranda</a>
<h1 class="section-title">🔢 ASN Lookup</h1>
<p style="color:#666;margin-bottom:20px">Cek Autonomous System Number dan organisasi jaringan.</p>

<div class="tool-form">
    <form id="asnForm">
        <div class="form-group">
            <label for="ip">IP Address</label>
            <input type="text" id="ip" placeholder="contoh: 8.8.8.8" required>
        </div>
        <button type="submit" class="btn btn-primary">Cek Sekarang</button>
    </form>
    <div class="loading">
        <div class="spinner"></div>
        <p>Sedang mengecek ASN...</p>
    </div>
    <div class="results"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.getElementById('asnForm').addEventListener('submit', function (e) {
        handleToolForm(e, `/ip/${document.getElementById('ip').value}/asn`);
    });
</script>
{% endblock %}
