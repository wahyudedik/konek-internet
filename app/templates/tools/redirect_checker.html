{% extends "base.html" %}
{% block title %}Redirect Checker - Lacak Redirect Chains{% endblock %}
{% block content %}
<a href="/" class="back-link">← Kembali ke Beranda</a>
<h1 class="section-title">🔀 Redirect Checker</h1>
<p style="color:#666;margin-bottom:20px">Lacak rantai redirect dari URL awal ke URL final.</p>

<div class="tool-form">
    <form id="redirectForm">
        <div class="form-group">
            <label for="domain">Domain / URL</label>
            <input type="text" id="domain" placeholder="contoh: google.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Cek Sekarang</button>
    </form>
    <div class="loading">
        <div class="spinner"></div>
        <p>Sedang melacak redirect...</p>
    </div>
    <div class="results"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.getElementById('redirectForm').addEventListener('submit', function (e) {
        handleToolForm(e, `/redirect/${extractDomain(document.getElementById('domain').value)}`);
    });
</script>
{% endblock %}
