{% extends "base.html" %}
{% block title %}SPF Checker - Validasi SPF Records{% endblock %}
{% block content %}
<a href="/" class="back-link">← Kembali ke Beranda</a>
<h1 class="section-title">🛡️ SPF Checker</h1>
<p style="color:#666;margin-bottom:20px">Validasi Sender Policy Framework records untuk keamanan email.</p>

<div class="tool-form">
    <form id="spfForm">
        <div class="form-group">
            <label for="domain">Domain</label>
            <input type="text" id="domain" placeholder="contoh: google.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Cek Sekarang</button>
    </form>
    <div class="loading">
        <div class="spinner"></div>
        <p>Sedang mengecek SPF records...</p>
    </div>
    <div class="results"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.getElementById('spfForm').addEventListener('submit', function (e) {
        handleToolForm(e, `/dns/${extractDomain(document.getElementById('domain').value)}/spf`);
    });
</script>
{% endblock %}
