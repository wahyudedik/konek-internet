{% extends "base.html" %}
{% block title %}TXT Lookup - Text Records{% endblock %}
{% block content %}
<a href="/" class="back-link">← Kembali ke Beranda</a>
<h1 class="section-title">📝 TXT Lookup</h1>
<p style="color:#666;margin-bottom:20px">Cek TXT records termasuk SPF, DKIM, dan verifikasi domain.</p>

<div class="tool-form">
    <form id="txtForm">
        <div class="form-group">
            <label for="domain">Domain</label>
            <input type="text" id="domain" placeholder="contoh: google.com" required>
        </div>
        <button type="submit" class="btn btn-primary">Cek Sekarang</button>
    </form>
    <div class="loading">
        <div class="spinner"></div>
        <p>Sedang mengecek TXT records...</p>
    </div>
    <div class="results"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.getElementById('txtForm').addEventListener('submit', function (e) {
        handleToolForm(e, `/dns/${extractDomain(document.getElementById('domain').value)}/txt`);
    });
</script>
{% endblock %}
